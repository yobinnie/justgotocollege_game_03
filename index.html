<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_upward" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor"></div> <!-- 커스텀 포인터 요소 추가 -->

    <button class="arrow-up">
        <span class="material-symbols-outlined">
arrow_upward
</span>
    </button>
    <div class="btns">
        <div class="container">
            <div class="btns__menu">
                <button class="btn home">Home</button>
                <button class="btn profile">Profile</button>
                <button class="btn work">Work</button>
                <button class="btn contact">Contact</button>
            </div>
        </div>
    </div>

    <section id="home">
        <img src="img/HOME_1.png" alt="Home" class="home-img">
    </section>
    <section id="profile">
        <div class="profile-container">
            <img src="img/PRO_BG.png" alt="Profile Background" class="profile-bg">
            <img src="img/PRO_left.png" alt="Left" class="pro-item item-left">
            <img src="img/PRO_profile.png" alt="Profile" class="pro-item item-profile">
            <img src="img/PRO_color.png" alt="Color" class="pro-item item-color">
            <img src="img/PRO_etc.png" alt="Etc" class="pro-item item-etc">
        </div>
    </section>
        <section id="line">
            <img src="img/BF_work.png" alt="Before" class="line-img">
        </section>
    <section id="work">
        <div class="work-container">
            <img src="img/WK_BG1.png" alt="Work Background Left" class="work-bg-left">
            <img src="img/WK_BG2.png" alt="Work Background Right" class="work-bg-right">
        </div>
    </section>
    <section id="contact">
        <div class="contact-container">
            <img src="img/CON__con.png" alt="contact" class="con-img">
            <div class="guestbook-container">
                <div class="guestbook-input">
                    <input type="text" id="nickname" placeholder="Nickname" maxlength="10">
                    <textarea id="opinion" placeholder="Your opinion..."></textarea>
                    <button id="btn-submit">Submit</button>
                </div>
                <div class="comment-viewer">
                    <div id="comment-list"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 커스텀 포인터 이동 로직
        const cursor = document.querySelector('.cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
            
            // 파티클 생성 로직 (불꽃놀이 효과)
            createParticle(e.clientX, e.clientY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = '★';
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            // 무작위 방향으로 퍼지게 설정
            const destinationX = (Math.random() - 0.5) * 100;
            const destinationY = (Math.random() - 0.5) * 100;
            particle.style.setProperty('--x', `${destinationX}px`);
            particle.style.setProperty('--y', `${destinationY}px`);

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
        }

        // 스크롤 및 버튼 이벤트
        const arrowUp = document.querySelector('.arrow-up');
        document.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                arrowUp.classList.add('show');
            } else {
                arrowUp.classList.remove('show');
            }
            console.log(window.scrollY)
        })
        arrowUp.addEventListener('click', function() {
            sectionHome.scrollIntoView({behavior:"smooth", block:"center"});
        })

        const btnHome = document.querySelector('.home');
        const sectionHome = document.querySelector('#home');
        btnHome.addEventListener('click', function() {
            sectionHome.scrollIntoView({behavior:"smooth", block: "center"});
        })


        const btnProfile = document.querySelector('.profile');
        const sectionProfile = document.querySelector('#profile');
        btnProfile.addEventListener('click', function() {
            sectionProfile.scrollIntoView({behavior:"smooth", block:"center"});
        })
        const btnWork = document.querySelector('.work');
        const sectionWork = document.querySelector('#work');
        btnWork.addEventListener('click', function() {
            sectionWork.scrollIntoView({behavior:"smooth", block:"center"});
        })
        const btnContact = document.querySelector('.contact');
        const sectionContact = document.querySelector('#contact');
        btnContact.addEventListener('click', function() {
            sectionContact.scrollIntoView({behavior:"smooth", block:"center"});
        })

        // 방명록 로직
        const btnSubmit = document.querySelector('#btn-submit');
        const commentList = document.querySelector('#comment-list');
        const inputNick = document.querySelector('#nickname');
        const inputOpinion = document.querySelector('#opinion');

        btnSubmit.addEventListener('click', () => {
            if (!inputNick.value || !inputOpinion.value) {
                alert('Please fill in both fields!');
                return;
            }
            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `<strong>${inputNick.value}</strong><p>${inputOpinion.value}</p>`;
            commentList.prepend(item); // 최신글이 위로

            inputNick.value = '';
            inputOpinion.value = '';
        });
    </script>

</body>
</html>
